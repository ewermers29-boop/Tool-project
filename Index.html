<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switchboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="panel" aria-live="polite">
    <section class="pattern-view" id="patternView">
      <header class="panel-header">
        <div>
          <p class="eyebrow">Switchboard</p>
          <h1>Pattern notice</h1>
        </div>
        <span class="tracking-state" id="trackingState">Tracking</span>
      </header>
      <p class="signal-label">Current signal</p>
      <h2 id="patternTitle">No repeated pattern yet.</h2>
      <p id="patternSummary">Switchboard is watching for repeated movement between tabs.</p>
      <div class="pattern-sequence" id="patternSequence">No pattern yet</div>
      <div class="pattern-stats">
        <div><span>Switches</span><strong id="switchCount">0</strong></div>
        <div><span>Window</span><strong id="timeWindow">10 min</strong></div>
      </div>
      <footer>
        <span id="historySummary">Local history: 0 switches</span>
        <button class="text-button" id="clearButton" type="button">Clear history</button>
      </footer>
    </section>

    <button class="warning-splash is-hidden" id="warningSplash" type="button" aria-label="Open warning choices">
      <span class="comic-burst" aria-hidden="true"><span>WARNING!</span></span>
      <span class="splash-prompt">Click anywhere to continue</span>
    </button>

    <section class="choice-screen is-hidden" id="choiceScreen" aria-labelledby="choiceTitle">
      <h1 id="choiceTitle">Pattern detected</h1>
      <div class="choice-actions">
        <button class="button button-primary" id="returnButton" type="button">Go back to previous tab</button>
        <button class="button button-secondary" id="seePatternButton" type="button">See pattern</button>
        <button class="button button-secondary" id="continueButton" type="button">Dismiss warning</button>
      </div>
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
